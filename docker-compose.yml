services:
  laverte-home-frontend:
    image: ${DOCKER_IMAGE:-laverte-home-frontend:latest}
    build:
      context: .
      args:
        API_ROOT: ${API_ROOT:-http://host.docker.internal:14000/api/v1}
        NEXT_PUBLIC_API_ROOT: ${NEXT_PUBLIC_API_ROOT:-http://host.docker.internal:14000/api/v1}
    ports:
      - "3000:3000"
    environment:
      - API_ROOT=${API_ROOT:-http://host.docker.internal:14000/api/v1}
      - NEXT_PUBLIC_API_ROOT=${NEXT_PUBLIC_API_ROOT:-http://host.docker.internal:14000/api/v1}
      - NODE_ENV=production
    restart: unless-stopped

version: '2.4'

services:
  web:
    image: ghcr.io/johnquangdev/laverte-home-frontend:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_ROOT=https://be.laverte.vn/api/v1
      - NEXT_PUBLIC_API_ROOT=https://be.laverte.vn/api/v1
    networks: [kpa_network]
    labels:
      - traefik.enable=true
      - traefik.docker.network=kpa_network
      - traefik.http.routers.laverte-fe.rule=Host(`dev.laverte.vn`)
      - traefik.http.routers.laverte-fe.entrypoints=websecure
      - traefik.http.routers.laverte-fe.tls.certresolver=letsencrypt
      - traefik.http.services.laverte-fe.loadbalancer.server.port=3000
      # cms.laverte.vn hosted the retired admin CMS. Redirect rather than let the
      # hostname 404; temporary (302) so browsers keep no memory of it if the
      # CMS is ever brought back.
      - traefik.http.routers.laverte-cms-retired.rule=Host(`cms.laverte.vn`)
      - traefik.http.routers.laverte-cms-retired.entrypoints=websecure
      - traefik.http.routers.laverte-cms-retired.tls.certresolver=letsencrypt
      - traefik.http.routers.laverte-cms-retired.middlewares=laverte-cms-retired
      - traefik.http.middlewares.laverte-cms-retired.redirectregex.regex=^https?://cms\.laverte\.vn/.*
      - traefik.http.middlewares.laverte-cms-retired.redirectregex.replacement=https://dev.laverte.vn/admin

networks:
  kpa_network:
    external: true

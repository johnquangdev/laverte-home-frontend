version: '2.4'

services:
  web:
    image: ghcr.io/johnquangdev/laverte-home-frontend:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_ROOT=https://be.laverte.vn/api/v1
      - NEXT_PUBLIC_API_ROOT=https://be.laverte.vn/api/v1
    networks: [kpa_network]
    labels:
      - traefik.enable=true
      - traefik.docker.network=kpa_network
      - traefik.http.routers.laverte-fe.rule=Host(`dev.laverte.vn`)
      - traefik.http.routers.laverte-fe.entrypoints=websecure
      - traefik.http.routers.laverte-fe.tls.certresolver=letsencrypt
      - traefik.http.services.laverte-fe.loadbalancer.server.port=3000

networks:
  kpa_network:
    external: true
